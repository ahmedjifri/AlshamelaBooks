name: Setup books release

# ينشئ إصدار الحزم مرة واحدة إن لم يكن موجوداً
on:
  push:
    branches:
      - main
      - setup-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view books >/dev/null 2>&1; then
            echo "release already exists"
          else
            gh release create books --target main --title "حزم الكتب" --notes-file release-notes-template.md
          fi

      # اختبار مؤقت: هل تحفظ واجهة الرفع الاسم العربي في حقل التسمية؟
      - name: Label test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/books" --jq .id)
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/$REL/assets" --jq '.[] | select(.name | endswith(".bin")) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done
          if [ -f .label-test ]; then
            echo test > t.bin
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @t.bin \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$REL/assets?name=label-test.bin&label=%D8%A7%D8%AE%D8%AA%D8%A8%D8%A7%D8%B1%20%D8%A7%D9%84%D8%A7%D8%B3%D9%85"
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @t.bin \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$REL/assets?name=%D8%A7%D9%84%D8%AD%D8%AF%D9%8A%D8%AB.bin"
          fi
